name: CI
on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appins
          POSTGRES_PASSWORD: test
          POSTGRES_DB: appins_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appins"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://appins:test@localhost:5432/appins_test
      OWNER_PASSWORD: ci-owner-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - name: test server
        run: |
          NO_COLOR=1 npm test --workspace server > /tmp/srv.log 2>&1 || SRV=1
          if [ "${SRV:-0}" = "1" ]; then
            sed -e 's/[[0-9;]*m//g' /tmp/srv.log | grep -E 'FAIL|AssertionError|Expected|Received|Error|expected|at ' | tail -n 10 | while IFS= read -r line; do echo "::error::$(echo "SRV $line" | cut -c1-250)"; done
            exit 1
          fi
      - name: test web
        run: |
          NO_COLOR=1 npm test --workspace web > /tmp/web.log 2>&1 || WEB=1
          if [ "${WEB:-0}" = "1" ]; then
            sed -e 's/[[0-9;]*m//g' /tmp/web.log | grep -E 'FAIL|Error' | tail -n 10 | while IFS= read -r line; do echo "::error::$(echo "WEB $line" | cut -c1-250)"; done
            exit 1
          fi
