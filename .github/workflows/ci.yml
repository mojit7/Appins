name: CI
on:
  push:
  pull_request:

# Least privilege: CI tests code but does not write to repository refs.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appins
          POSTGRES_PASSWORD: test
          POSTGRES_DB: appins_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appins"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://appins:test@localhost:5432/appins_test
      OWNER_PASSWORD: ci-owner-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci enforces the committed lockfile; CI must not silently regenerate it.
      - name: install (lockfile-verified)
        run: npm ci
      - name: dependency audit
        run: npm audit --audit-level=high
      - name: typecheck
        run: npm run typecheck
      - name: build
        run: npm run build
      - name: test server
        run: npm test --workspace server
      - name: test web
        run: npm test --workspace web
