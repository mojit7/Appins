name: CI
on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appins
          POSTGRES_PASSWORD: test
          POSTGRES_DB: appins_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appins"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://appins:test@localhost:5432/appins_test
      OWNER_PASSWORD: ci-owner-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ساخت reproducer: lockfile ساخته/همگام می‌شود و نصب قطعی با npm ci انجام می‌گیرد
      # (Twelve-Factor V — dev/prod parity؛ npm install آزاد ممنوع)
      - name: install (lockfile-verified)
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
      - run: npm audit --audit-level=high
      - name: typecheck
        run: |
          NO_COLOR=1 npm run typecheck > /tmp/tc.log 2>&1 || TC=1
          cat /tmp/tc.log
          if [ "${TC:-0}" = "1" ]; then
            tail -n 200 /tmp/tc.log > /tmp/ci-failure.log
            echo "TYPECHECK FAILED" >> /tmp/ci-failure.log
            exit 1
          fi
      - name: build
        run: |
          NO_COLOR=1 npm run build > /tmp/build.log 2>&1 || BLD=1
          tail -n 40 /tmp/build.log
          if [ "${BLD:-0}" = "1" ]; then
            tail -n 200 /tmp/build.log > /tmp/ci-failure.log
            echo "BUILD FAILED" >> /tmp/ci-failure.log
            exit 1
          fi
      - name: test server
        run: |
          NO_COLOR=1 npm test --workspace server > /tmp/srv.log 2>&1 || SRV=1
          if [ "${SRV:-0}" = "1" ]; then
            sed -e $'s/\x1b\[[0-9;]*m//g' /tmp/srv.log | tail -n 400 > /tmp/ci-failure.log
            echo "SERVER TESTS FAILED" >> /tmp/ci-failure.log
            exit 1
          fi
      - name: test web
        run: |
          NO_COLOR=1 npm test --workspace web > /tmp/web.log 2>&1 || WEB=1
          if [ "${WEB:-0}" = "1" ]; then
            sed -e $'s/\x1b\[[0-9;]*m//g' /tmp/web.log | tail -n 100 >> /tmp/ci-failure.log
            echo "WEB TESTS FAILED" >> /tmp/ci-failure.log
            exit 1
          fi
      # ثبت lockfile در main تا نصب تولید همان درخت وابستگی CI باشد
      - name: commit lockfile to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "ci-lockfile-bot"
            git config user.email "actions@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/mojit7/Appins.git"
            git add package-lock.json
            git commit --quiet -m "chore: pin dependency lockfile [skip ci]"
            git push origin HEAD:main
          fi
      - name: publish failure log
        if: failure()
        run: |
          git config user.name "ci-debug-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/mojit7/Appins.git"
          git checkout -B ci-debug
          git rm -rf --quiet .
          if [ -f /tmp/ci-failure.log ]; then cp /tmp/ci-failure.log ./ci-failure.log; else echo "no ci-failure.log captured" > ./ci-failure.log; fi
          git add ci-failure.log
          git commit --quiet -m "ci failure log [skip ci]"
          git push --force origin ci-debug
