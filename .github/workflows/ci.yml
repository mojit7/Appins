name: CI
on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appins
          POSTGRES_PASSWORD: test
          POSTGRES_DB: appins_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appins"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://appins:test@localhost:5432/appins_test
      OWNER_PASSWORD: ci-owner-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: audit
        run: |
          npm audit --audit-level=high > /tmp/audit.log 2>&1 || AUD=1
          tail -n 60 /tmp/audit.log
          if [ "${AUD:-0}" = "1" ]; then echo "AUDIT EXIT NONZERO" >> /tmp/audit.log; fi
      - name: typecheck
        run: |
          NO_COLOR=1 npm run typecheck > /tmp/tc.log 2>&1 || TC=1
          cat /tmp/tc.log
          if [ "${TC:-0}" = "1" ]; then exit 1; fi
      - name: build
        run: |
          NO_COLOR=1 npm run build > /tmp/build.log 2>&1 || BLD=1
          tail -n 40 /tmp/build.log
          if [ "${BLD:-0}" = "1" ]; then exit 1; fi
      - name: test server
        run: |
          NO_COLOR=1 npm test --workspace server > /tmp/srv.log 2>&1; SRV=$?
          tail -n 40 /tmp/srv.log
          if [ "$SRV" != "0" ]; then exit 1; fi
      - name: test web
        run: |
          NO_COLOR=1 npm test --workspace web > /tmp/web.log 2>&1; WEB=$?
          tail -n 40 /tmp/web.log
          if [ "$WEB" != "0" ]; then exit 1; fi
      - name: publish audit logs
        if: always()
        run: |
          git config user.name "ci-debug-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/mojit7/Appins.git"
          git checkout -B ci-audit
          git rm -rf --quiet .
          cp /tmp/audit.log ./audit.log 2>/dev/null || echo "no audit log" > ./audit.log
          cp /tmp/tc.log ./typecheck.log 2>/dev/null || echo "no tc log" > ./typecheck.log
          cp /tmp/build.log ./build.log 2>/dev/null || echo "no build log" > ./build.log
          cp /tmp/srv.log ./server-tests.log 2>/dev/null || echo "no srv log" > ./server-tests.log
          cp /tmp/web.log ./web-tests.log 2>/dev/null || echo "no web log" > ./web-tests.log
          git add -A
          git commit --quiet -m "release audit logs [skip ci]"
          git push --force origin ci-audit
