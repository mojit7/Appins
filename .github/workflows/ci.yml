name: CI
on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appins
          POSTGRES_PASSWORD: test
          POSTGRES_DB: appins_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appins"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://appins:test@localhost:5432/appins_test
      OWNER_PASSWORD: ci-owner-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - name: test
        run: |
          npm test --workspace server > /tmp/srv.log 2>&1 || SRV=1
          npm test --workspace web > /tmp/web.log 2>&1 || WEB=1
          if [ "${SRV:-0}" = "1" ] || [ "${WEB:-0}" = "1" ]; then
            tail -n 150 /tmp/srv.log | while IFS= read -r line; do echo "::error::SRV $line" | cut -c1-260; done
            tail -n 30 /tmp/web.log | while IFS= read -r line; do echo "::error::WEB $line" | cut -c1-260; done
            exit 1
          fi
