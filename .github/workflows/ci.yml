name: CI
on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appins
          POSTGRES_PASSWORD: test
          POSTGRES_DB: appins_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appins"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://appins:test@localhost:5432/appins_test
      OWNER_PASSWORD: ci-owner-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --audit-level=high
      - name: typecheck
        run: |
          npm run typecheck --workspace server 2>&1 | sed 's/^/SERVER /' > /tmp/tc.log || true
          npm run typecheck --workspace web 2>&1 | sed 's/^/WEB /' >> /tmp/tc.log || true
          while IFS= read -r line; do echo "::error::$(echo "$line" | cut -c1-240)"; done < /tmp/tc.log
          if grep -q 'error TS' /tmp/tc.log; then exit 1; fi
      - run: npm run build
      - run: npm test
